[package]
name = "sts-cli"
version = "2.2.0"
description = "星TAP 极速搜索 CLI - 轻量独立版本，不依赖 Tauri"
authors = ["星TAP实验室 <cscb603@qq.com>"]
edition = "2021"

[[bin]]
name = "sts"
path = "src/main.rs"

[dependencies]
sts-core = { path = "../sts-core" }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4", features = ["derive"] }
