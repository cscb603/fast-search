[package]
name = "star-tap-fast-search"
version = "2.2.0"
description = "星TAP 极速搜索 - 基于 Tauri 2.0 的全硬盘秒级检索工具，堪比 Everything 的 Mac 极速搜索体验。集成 fd/rg 极客工具加速。"
authors = ["星TAP实验室 <cscb603@qq.com>"]
edition = "2021"
default-run = "star-tap-fast-search"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sts-core = { path = "../crates/sts-core" }
# MCP HTTP 服务基座（复用 core_lib::mcp，axum/tokio 由它 re-export）
core_lib = { path = "../../rust_master_workspace/libs/core_lib", default-features = false, features = ["mcp"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-cli = "2"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
