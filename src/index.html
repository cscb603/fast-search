<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星TAP 极速搜索</title>
    <style>body{background:var(--bg)}</style>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="header">
        <div class="top-bar">
          <span class="app-icon">🚀</span>
          <span class="app-name">星TAP 极速搜索</span>
          <span class="theme-toggle" id="theme-toggle" title="切换主题">🖥️</span>
        </div>
        <div class="tabs" id="filter-tabs">
          <button class="tab-btn active" data-type="all">全部</button>
          <button class="tab-btn" data-type="image">图片</button>
          <button class="tab-btn" data-type="video">视频</button>
          <button class="tab-btn" data-type="doc">文档</button>
          <button class="tab-btn" data-type="app">程序</button>
          <button class="tab-btn" data-type="folder">文件夹</button>
          <button class="tab-btn" data-type="content">🔍内容</button>
        </div>
        <div class="search-box">
          <input id="search-input" placeholder="输入关键字搜索…也可点分类浏览最近文件" autofocus />
          <div class="status-bar">
            <span id="indexing-status" class="indexing-status"></span>
            <span id="tip-text" class="tip-text"></span>
            <span id="mcp-status" class="mcp-status"></span>
          </div>
        </div>
      </div>
      <div id="results" class="results-list">
        <div class="placeholder">输入关键字开始搜索，或点分类看最近文件</div>
      </div>
    </main>
  </body>
</html>
